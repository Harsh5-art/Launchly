<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Download your Playbook | Launchly</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0c0c0d;color:#fff;font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
.card{max-width:480px;border:1px solid #2a2a2e;border-radius:10px;padding:36px;background:#141416}
h1{font-size:28px;margin-bottom:10px}
p{color:#a8a8b0}
.btn{display:block;margin-top:22px;padding:15px 26px;border-radius:6px;background:linear-gradient(120deg,#ff5a1f,#ffb21f);color:#160a02;font-weight:700;text-decoration:none}
.btn.ghost{margin-top:12px;background:none;color:#fff;border:1px solid #2a2a2e}
.btn.ghost:hover{border-color:#ff5a1f}
small{display:block;margin-top:22px;font-size:14px;color:#a8a8b0}
</style>
</head>
<body>
<main class="card" id="box">
  <h1>Confirming your payment…</h1>
  <p>Please wait a moment.</p>
</main>
<script>
(function () {
  var PDF = "files/0a1841037168/The-Digital-Product-Playbook.pdf";
  var p = new URLSearchParams(location.search);
  var paymentId = p.get("razorpay_payment_id");
  var status = p.get("razorpay_payment_link_status"); // present for Razorpay payment links
  var ok = paymentId && (!status || status === "paid");

  var box = document.getElementById("box");
  if (ok) {
    try {
      localStorage.setItem("launchly_access", JSON.stringify({ id: paymentId, at: Date.now() }));
    } catch (e) {}
    box.innerHTML =
      "<h1>Payment received 🎉</h1>" +
      "<p>Thanks for buying <strong style=\"color:#fff\">The Digital Product Playbook</strong>. Download the PDF below and save it to your phone or laptop.</p>" +
      '<a class="btn" href="' + PDF + '" download="The Digital Product Playbook.pdf">Download the Playbook (PDF)</a>' +
      "<small>Your payment ID: " + paymentId.replace(/[^\w-]/g, "") + "<br>Keep it in case you need help getting your download again.</small>";
  } else {
    box.innerHTML = "<h1>We couldn't confirm a payment</h1><p>If you already paid, contact us at <a href=\"mailto:harshkalantri202@gmail.com\" style=\"color:#ffb21f\">harshkalantri202@gmail.com</a> with the payment ID from your Razorpay receipt. Otherwise, you can pay from the home page.</p>" +
      '<a class="btn" href="index.html#pricing">Go to pricing</a>';
  }
})();
</script>
</body>
</html>
