<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Payment | Launchly</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0c0c0d;color:#fff;font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
.card{max-width:460px;border:1px solid #2a2a2e;border-radius:10px;padding:36px;background:#141416}
h1{font-size:28px;margin-bottom:10px}
p{color:#a8a8b0}
a.btn{display:inline-block;margin-top:22px;padding:14px 26px;border-radius:6px;background:linear-gradient(120deg,#ff5a1f,#ffb21f);color:#160a02;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main class="card" id="box">
  <h1>Confirming your payment…</h1>
  <p>Please wait a moment.</p>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var paymentId = p.get("razorpay_payment_id");
  var status = p.get("razorpay_payment_link_status"); // present for Razorpay payment links
  var ok = paymentId && (!status || status === "paid");

  var box = document.getElementById("box");
  if (ok) {
    try {
      localStorage.setItem("launchly_access", JSON.stringify({ id: paymentId, at: Date.now() }));
    } catch (e) {}
    box.innerHTML = "<h1>Payment received</h1><p>Opening your course…<br>Bookmark the next page so you can return any time.</p>" +
      '<a class="btn" href="digital-product.html">Open my course</a>';
    setTimeout(function () { location.replace("digital-product.html"); }, 1500);
  } else {
    box.innerHTML = "<h1>We couldn't confirm a payment</h1><p>If you already paid, email support with your payment ID. Otherwise, you can pay from the home page.</p>" +
      '<a class="btn" href="index.html#pricing">Go to pricing</a>';
  }
})();
</script>
</body>
</html>
