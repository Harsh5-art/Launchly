<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090f">
  <title>Create account | Launchly</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f7f7fb; background:
      radial-gradient(circle at 15% 15%, rgba(124,58,237,.22), transparent 32%),
      radial-gradient(circle at 85% 85%, rgba(99,102,241,.16), transparent 30%), #09090f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card { width: 100%; max-width: 440px; padding: 38px; border: 1px solid #292638; border-radius: 22px; background: rgba(18,17,27,.94); box-shadow: 0 24px 80px rgba(0,0,0,.4); }
    .brand { color: #a78bfa; font-size: 14px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 18px 0 8px; font-size: 30px; letter-spacing: -.04em; }
    .sub { margin: 0 0 28px; color: #aaa6b8; line-height: 1.6; font-size: 14px; }
    label { display: block; margin: 17px 0 8px; color: #e7e4ef; font-size: 13px; font-weight: 650; }
    input { width: 100%; padding: 14px 15px; color: white; background: #100f18; border: 1px solid #353144; border-radius: 11px; outline: none; font-size: 15px; }
    input:focus { border-color: #9b78ff; box-shadow: 0 0 0 3px rgba(139,92,246,.16); }
    button { width: 100%; margin-top: 23px; padding: 15px; border: 0; border-radius: 11px; color: white; background: linear-gradient(100deg,#7c3aed,#6d5dfc); font-size: 15px; font-weight: 750; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .message { display: none; margin-top: 16px; padding: 12px 13px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
    .message.error { display: block; color: #fecaca; background: rgba(220,38,38,.12); border: 1px solid rgba(248,113,113,.25); }
    .message.success { display: block; color: #bbf7d0; background: rgba(22,163,74,.12); border: 1px solid rgba(74,222,128,.25); }
    .foot { margin: 23px 0 0; text-align: center; color: #aaa6b8; font-size: 14px; }
    a { color: #b49aff; text-decoration: none; font-weight: 650; }
    a:hover { text-decoration: underline; }
    .back { display: inline-block; margin-top: 22px; color: #aaa6b8; font-size: 13px; font-weight: 500; }
    @media (max-width: 480px) { .card { padding: 28px 22px; } h1 { font-size: 27px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Launchly</div>
    <h1>Create your account</h1>
    <p class="sub">Create your Launchly account so your learning access can be linked to you.</p>

    <form id="signup-form">
      <label for="full-name">Full name</label>
      <input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="Your name" required maxlength="80">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>

      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password" minlength="8" required>

      <button id="submit-button" type="submit">Create account</button>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

    <p class="foot">Already have an account? <a href="login.html">Log in</a></p>
    <a class="back" href="index.html">← Back to Launchly</a>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Replace these two values with your Supabase Project URL and anon/publishable key.
    // Never put your Supabase service_role key in browser code.
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const form = document.getElementById("signup-form");
    const button = document.getElementById("submit-button");
    const message = document.getElementById("message");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "message";

      const fullName = document.getElementById("full-name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (password.length < 8) {
        showMessage("Please use a password with at least 8 characters.");
        return;
      }
      if (password !== confirmPassword) {
        showMessage("The passwords do not match.");
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: fullName },
            emailRedirectTo: `${window.location.origin}/login.html`
          }
        });

        if (error) throw error;

        if (data.session) {
          showMessage("Your account is ready. Opening Launchly...", "success");
          window.location.href = "my-learning.html";
        } else {
          showMessage("Account created. Please check your email and confirm your address, then log in.", "success");
          button.disabled = false;
          button.textContent = "Create account";
          form.reset();
        }
      } catch (error) {
        showMessage(error.message || "Unable to create your account. Please try again.");
        button.disabled = false;
        button.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
