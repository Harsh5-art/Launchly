<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>My Download | Launchly</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0c0c0d;color:#fff;font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
.card{max-width:480px;border:1px solid #2a2a2e;border-radius:10px;padding:36px;background:#141416}
h1{font-size:28px;margin-bottom:10px}
p{color:#a8a8b0}
.btn{display:block;margin-top:22px;padding:15px 26px;border-radius:6px;background:linear-gradient(120deg,#ff5a1f,#ffb21f);color:#160a02;font-weight:700;text-decoration:none}
.btn.ghost{margin-top:12px;background:none;color:#fff;border:1px solid #2a2a2e}
.btn.ghost:hover{border-color:#ff5a1f}
</style>
</head>
<body>
<main class="card" id="box"></main>
<script>
(function () {
  var PDF = "files/0a1841037168/The-Digital-Product-Playbook.pdf";
  var paid = false;
  try { paid = !!localStorage.getItem("launchly_access"); } catch (e) {}
  var box = document.getElementById("box");
  if (paid) {
    box.innerHTML =
      "<h1>📘 The Digital Product Playbook</h1>" +
      "<p>8-page PDF guide · 5 modules. Save it to your phone or laptop so you always have it.</p>" +
      '<a class="btn" href="' + PDF + '" download="The Digital Product Playbook.pdf">Download the Playbook (PDF)</a>' +
      '<a class="btn ghost" href="index.html">Back to home</a>';
  } else {
    box.innerHTML =
      "<h1>Get The Digital Product Playbook</h1>" +
      "<p>We couldn't find a purchase on this browser. If you already paid, contact us with the payment ID from your Razorpay receipt and we'll send you the PDF.</p>" +
      '<a class="btn" href="https://rzp.io/rzp/iMNCI439">Buy for ₹199</a>' +
      '<a class="btn ghost" href="index.html">Back to home</a>';
  }
})();
</script>
</body>
</html>
